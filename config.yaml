# Single source of truth for the backtest. Nothing below should be hardcoded
# elsewhere in src/ - read it from here so results stay reproducible.

capital:
  starting_value_inr: 10000000   # Rs 1,00,00,000 = Rs 1 crore

universe:
  sources:
    - data/universe/nifty100.csv
    - data/universe/midcap100.csv
    - data/universe/smallcap100.csv
  max_holdings: 10

dates:
  backtest_start: "2021-01-01"
  backtest_end: "2025-12-31"
  out_of_sample_start: "2026-01-01"
  out_of_sample_end: "2026-06-30"
  # extra lookback so factors (e.g. 12-month momentum) are computable from day 1
  data_start: "2019-06-01"

costs:
  transaction_cost_pct: 0.001    # 0.1% per transaction, applied on both buys and sells

# Factor definitions. These are chosen from convention, NOT optimised on this data -
# that is the whole argument for why the rule should generalise out-of-sample. Do not
# tune them against the backtest result; if you change anything here, say so in the
# report and re-run both windows.
# Every value below was chosen by the ladder + sweeps in src/experiments.py, and
# each is defended by a PLATEAU (neighbouring values also work), never by a peak.
# Reproduce with: python -m src.experiments --all
factors:
  # 12 months is the textbook lookback. The sweep over 3/6/9/12/15/18/24 is jagged
  # rather than smoothly peaked, which means those differences are sampling noise -
  # so we keep the conventional value rather than mining it.
  momentum_lookback_months: 12
  # Skip the most recent TWO months, not one. Short-term reversal persists longer in
  # mid/smallcaps than the textbook 1-month skip assumes. Selection alpha over
  # skip = 0/1/2/3/4 is +10.2 / +16.0 / +21.0 / +16.4 / +13.7 - a smooth hump centred
  # on 2, not a spike. HONESTY NOTE: this is the one parameter picked from this data
  # rather than from convention. skip=1 (the literature standard) also works and is
  # the conservative fallback; see docs/strategy_notes.md.
  momentum_skip_months: 2
  low_vol_lookback_months: 6
  liquidity_lookback_months: 3
  # Rs 5 crore average daily turnover. A Rs 10-25 lakh position is then well under
  # 1% of a typical day's volume, so the fills we assume are realistic.
  min_avg_daily_turnover_inr: 50000000
  # 60/40, not 50/50. Low-vol is a REAL drag as a selection factor - on its own it
  # scores -17.3% mean selection alpha and is negative in 4 of 5 years. But a little
  # of it still buys drawdown protection. Selection alpha across momentum weight
  # 30..100% rises to a broad plateau at 55-70% (+15.6 / +17.3 / +14.9) and 50/50
  # sits on the edge of a cliff: at 50% out-of-sample alpha is -3.7%, at 55% it is
  # +5.9%. 60% is the middle of the safe region.
  weights:
    momentum: 0.6
    low_vol: 0.4

rebalance:
  frequency: "M"                # "M" monthly, "Q" quarterly - pick deliberately, see docs/strategy_notes.md
  weighting_scheme: "score_proportional"   # or "equal_weight", "inverse_vol"
  max_weight_per_stock: 0.25    # concentration cap, avoid a single name dominating PnL
  # Hysteresis: a held name is only sold once it drops out of the top `buffer_rank`.
  # Purely a turnover/cost reduction rule. Set to null to disable.
  buffer_rank: 15

benchmark:
  ticker: "^CNX100"             # verify with: python -m src.benchmark --check
  name: "Nifty 100"
  # Secondary benchmark, reported alongside the headline one. Nifty 500 is the
  # honest broad-market comparison: it spans large, mid AND small caps, which is
  # what our universe actually draws from. A literal 1/3-1/3-1/3 blend of the three
  # source indices is NOT available - Yahoo publishes no working Smallcap 100
  # symbol (^CNXSC and ^CNXSMCP both return empty). Verified with:
  #   python -m src.benchmark --check
  secondary_ticker: "^CRSLDX"
  secondary_name: "Nifty 500"

risk_free_rate: 0.0             # per the guidelines, use 0% for Sharpe
