# Single source of truth for the backtest. Nothing below should be hardcoded
# elsewhere in src/ - read it from here so results stay reproducible.

capital:
  starting_value_inr: 10000000   # Rs 1,00,00,000 = Rs 1 crore

universe:
  sources:
    - data/universe/nifty100.csv
    - data/universe/midcap100.csv
    - data/universe/smallcap100.csv
  max_holdings: 10

dates:
  backtest_start: "2021-01-01"
  backtest_end: "2025-12-31"
  out_of_sample_start: "2026-01-01"
  out_of_sample_end: "2026-06-30"
  # extra lookback so factors (e.g. 12-month momentum) are computable from day 1
  data_start: "2019-06-01"

costs:
  transaction_cost_pct: 0.001    # 0.1% per transaction, applied on both buys and sells

# Factor definitions. Parameters are fixed by convention plus a TRAIN/VALIDATE split
# INSIDE the backtest period - never by looking at the 2026 out-of-sample window. The
# protocol: select on 2021-2023 (train), confirm the choice still works on 2024-2025
# (validate), and only then run 2026 H1 once as a genuinely held-out test. This is the
# whole argument for why the rule should generalise. Do not tune anything here against
# the 2026 result; if you change a value, say so in the report and re-run both windows.
# Reproduce the selection evidence with: python -m src.experiments --select
factors:
  # 12 months is the textbook lookback AND the robust choice on the split: train
  # selection alpha peaks near 9-12 months (+30.0 / +28.9) and 12 also validates well
  # (+11.8), while the very short and very long windows are jagged and validate poorly.
  # Convention and the data agree, so we keep the conventional value.
  momentum_lookback_months: 12
  # Skip the most recent TWO months, not one. Short-term reversal persists longer in
  # mid/smallcaps than the textbook 1-month skip assumes. On the split, train selection
  # alpha over skip = 0/1/2/3/4 is +16.2 / +20.3 / +28.9 / +15.0 / +16.9 - a hump
  # centred on 2 - and skip=2 also validates strongly (+11.8 on 2024-2025). HONESTY
  # NOTE: this is the one parameter chosen from the data rather than from convention;
  # it was chosen on TRAIN and confirmed on VALIDATE, not on 2026. skip=1 (the
  # literature standard) is the conservative fallback and also validates - see
  # docs/strategy_notes.md.
  momentum_skip_months: 2
  low_vol_lookback_months: 6
  liquidity_lookback_months: 3
  # Rs 5 crore average daily turnover. A Rs 10-25 lakh position is then well under
  # 1% of a typical day's volume, so the fills we assume are realistic.
  min_avg_daily_turnover_inr: 50000000
  # 55/45. Low-vol is a drag as a SELECTION factor on its own (negative selection alpha
  # in isolation), but a meaningful slice of it buys drawdown protection. The split
  # decides the mix honestly: train selection alpha rises to a plateau above 55%
  # (+33.6 at 55, +39.4 at 60, up to +44 at 80), but VALIDATE - the generalisation
  # test - peaks at 50-55% (+11.8 / +11.7) and falls steadily as momentum weight rises
  # (+7.3 at 60, +4.2 at 70, -0.1 at 80). We take 55%: the largest momentum tilt that
  # is still validate-optimal, and the lower momentum weight also improves drawdown.
  # We deliberately do NOT chase the higher train-only optimum, which overfits 2021-23.
  weights:
    momentum: 0.55
    low_vol: 0.45

rebalance:
  frequency: "M"                # "M" monthly, "Q" quarterly - pick deliberately, see docs/strategy_notes.md
  weighting_scheme: "score_proportional"   # or "equal_weight", "inverse_vol"
  max_weight_per_stock: 0.25    # concentration cap, avoid a single name dominating PnL
  # Hysteresis: a held name is only sold once it drops out of the top `buffer_rank`.
  # Purely a turnover/cost reduction rule. Set to null to disable.
  buffer_rank: 15

benchmark:
  ticker: "^CNX100"             # verify with: python -m src.benchmark --check
  name: "Nifty 100"
  # Secondary benchmark, reported alongside the headline one. Nifty 500 is the
  # honest broad-market comparison: it spans large, mid AND small caps, which is
  # what our universe actually draws from. A literal 1/3-1/3-1/3 blend of the three
  # source indices is NOT available - Yahoo publishes no working Smallcap 100
  # symbol (^CNXSC and ^CNXSMCP both return empty). Verified with:
  #   python -m src.benchmark --check
  secondary_ticker: "^CRSLDX"
  secondary_name: "Nifty 500"

risk_free_rate: 0.0             # per the guidelines, use 0% for Sharpe
